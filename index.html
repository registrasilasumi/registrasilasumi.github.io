<style>
/* Tema abu muda: pita judul abu, kartu putih, aksen abu-biru tua. Tab menempel di pita judul. */
:root{
  --bg:#EBEDEF;--panel:#FFFFFF;--top:#DCE0E3;--ink:#1E272D;--ink2:#4E5B64;--ink3:#76838C;--line:#CDD3D8;
  --accent:#46576A;--accentbg:#E3E8EC;--blue:#2F6FB3;--teal:#1F6F6B;--gold:#B88A0B;--violet:#6A55A8;--ok:#2E6B3B;--okbg:#E3F0E4;--warn:#80530A;--warnbg:#F7EACB;--bad:#9A2C2C;--badbg:#F6E0DE;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14181B;--panel:#1D2327;--top:#1A2024;--ink:#E5EAED;--ink2:#A6B2B9;--ink3:#83909A;--line:#2E383E;
  --accent:#9DB2C6;--accentbg:#26323B;--blue:#7FB0E6;--teal:#6CC3BD;--gold:#E6C255;--violet:#B3A3E6;--ok:#8DC896;--okbg:#1F3524;--warn:#E4B65B;--warnbg:#3A2E12;--bad:#E78D8D;--badbg:#3E1F1F;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#14181B;--panel:#1D2327;--top:#1A2024;--ink:#E5EAED;--ink2:#A6B2B9;--ink3:#83909A;--line:#2E383E;
  --accent:#9DB2C6;--accentbg:#26323B;--blue:#7FB0E6;--teal:#6CC3BD;--gold:#E6C255;--violet:#B3A3E6;--ok:#8DC896;--okbg:#1F3524;--warn:#E4B65B;--warnbg:#3A2E12;--bad:#E78D8D;--badbg:#3E1F1F;color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
#app{padding-bottom:48px;padding-top:16px}
.hero{background:var(--top);position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero::before{content:'';position:absolute;right:0;top:0;bottom:0;width:min(50%,440px);background:var(--photo) center/cover no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 38%);mask-image:linear-gradient(90deg,transparent 0,#000 38%);z-index:0}
.hero .wrap{position:relative;z-index:1}
.navbar{background:var(--top);border-bottom:1px solid var(--line);border-top:3px solid var(--gold);position:sticky;top:0;z-index:5}
header{min-height:190px;padding:20px 0;display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.logos{display:flex;align-items:center;gap:10px;flex:none}
.logo{width:56px;height:56px;background-position:center;background-repeat:no-repeat;background-size:contain}
.lk{background-image:var(--logo-k)}.lp{background-image:var(--logo-p)}.ll{background-image:var(--logo-l);width:64px;height:64px}
:root[data-theme="dark"] .logo{filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff) drop-shadow(0 0 5px rgba(255,255,255,.45))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff) drop-shadow(0 0 5px rgba(255,255,255,.45))}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero::before{filter:brightness(.78)}}
:root[data-theme="dark"] .hero::before{filter:brightness(.78)}
#app{position:relative;z-index:1}
.stack{display:flex;flex-direction:column;gap:12px}
.stack>.card:last-child{flex:1}
.stack>.card{margin:0}
.bars2{columns:2;column-gap:36px}
.bars2 .bar{break-inside:avoid}
.eyebrow{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
h1{font-size:19px;font-weight:600;margin:0;text-wrap:balance}
.sub{color:var(--ink2);font-size:13px}
.fresh{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--panel)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.navrow{display:flex;align-items:center;gap:12px}
.theme{display:flex;flex:none;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.theme button{font:inherit;font-size:12.5px;display:flex;align-items:center;gap:5px;border:0;background:none;color:var(--ink2);padding:5px 10px;cursor:pointer}
.theme button+button{border-left:1px solid var(--line)}
.theme button[aria-pressed="true"]{background:var(--accentbg);color:var(--ink);font-weight:500}
.theme svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav::-webkit-scrollbar{display:none}
nav button{font:inherit;background:none;border:0;padding:10px 14px;color:var(--ink2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;min-height:44px}
nav button:hover{color:var(--ink)}
nav button[aria-selected="true"]{color:var(--ink);font-weight:500;border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ponly{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.tile{--tc:var(--accent);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;border-top:3px solid var(--tc);position:relative}

    var em = kode ? null : h('input', { type: 'text', id: 'em', autocomplete: 'username', placeholder: 'nama@instansi.go.id', 'aria-label': 'Email' });
    var pw = h('input', { type: 'password', id: 'pw', autocomplete: kode ? 'off' : 'current-password', placeholder: kode ? 'Kode akses' : 'Kata sandi', 'aria-label': kode ? 'Kode akses' : 'Kata sandi' });
    var out = h('div');
    var btn = h('button', { class: 'btn pri', type: 'submit', text: 'Masuk' });
    var form = h('form', { style: 'display:grid;gap:10px;max-width:340px;margin:24px auto', onsubmit: function (e) {
      e.preventDefault();
      clear(out); btn.disabled = true; btn.textContent = 'Memeriksa…';
      var p = kode ? window.Store.loginKode(pw.value.trim()) : window.Store.login(em.value.trim(), pw.value);
      p.then(function () { location.reload(); }).catch(function (er) {
        btn.disabled = false; btn.textContent = 'Masuk';
        out.append(h('div', { class: 'msg bad', text: errText(er) }));
      });
    } }, h('h2', { text: kode ? 'Masukkan kode akses' : 'Masuk', style: 'margin:0' }), h('div', { class: 'muted', text: kode ? 'Khusus anggota registrasi. Setelah masuk, perangkat ini tetap masuk sampai Anda memilih Keluar akun.' : 'Khusus anggota registrasi. Akun dibuat oleh admin.' }), em, pw, btn, out);
    return h('div', { class: 'card' }, form);
  }
  async function initWeb() {
    var St = window.Store, sess;
    try { sess = await St.session(); } catch (e) { clear($view).append(h('div', { class: 'msg bad', text: errText(e) })); return; }
    if (!sess) { document.getElementById('nav').hidden = true; var bb = document.getElementById('bnav'); if (bb) bb.hidden = true; clear($view).append(loginView()); return; }
    var lo = h('button', { class: 'btn', text: 'Keluar akun', title: St.email(), style: 'flex:none', onclick: function () { St.logout().then(function () { location.reload(); }); } });
    document.querySelector('.navrow').appendChild(lo);
    S.db = St.db; S.sample = St.sample; S.canWrite = St.canWrite();
    if (!wr() && (ui.tab === 'unggah' || ui.tab === 'laporan')) ui.tab = 'beranda';
    nav();
    setup();
  }

  async function init() {
    var t = (location.hash || '').replace('#', '');
    if (TABS.some(function (x) { return x[0] === t; })) ui.tab = t;
    applyTema(tema()); drawTema();
    nav(); head();
    window.addEventListener('hashchange', function () { var x = location.hash.replace('#', ''); if (x !== ui.tab && TABS.some(function (y) { return y[0] === x; })) { ui.tab = x; nav(); render(); } });
    if (window.Store) { initWeb(); return; }
    var cl = window.claude;
    if (!cl || !cl.use) { clear($view).append(h('div', { class: 'msg bad', text: 'Halaman ini perlu dibuka dari claude.ai agar bisa menyimpan data.' })); return; }
    var results = await Promise.all([cl.use('db'), cl.use('user'), cl.use('sample')]);
    S.db = results[0];
    S.sample = results[2];
    if (!S.db) { clear($view).append(h('div', { class: 'msg bad', text: 'Penyimpanan data tidak tersedia. Masuk ke akun Anda lalu buka ulang halaman ini.' })); return; }
    try { var u = results[1]; S.canWrite = u && u.can ? u.can('data.write') : null; } catch (e) { S.canWrite = null; }
    setup();
  }
  init();
})();

</script>
<style id="patch-nav">
.navrow{align-items:center}
.navrow #nav{flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.navrow #nav::-webkit-scrollbar{display:none}
.navrow #nav>*{flex:0 0 auto;white-space:nowrap}
.navrow .btn{flex:0 0 auto;white-space:nowrap}
.toolrow{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding-top:10px;padding-bottom:0}
.toolrow #tvbtn,.toolrow #theme{flex:0 0 auto}
</style>
<style id="patch-bnav">
#bnav,#bmenu{display:none}
@media (max-width:640px){
  .navrow #nav{display:none}
  body{padding-top:calc(58px + env(safe-area-inset-top))}
  #bnav{display:flex;position:fixed;left:0;right:0;top:0;z-index:20;background:var(--top);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  #bnav[hidden]{display:none}
  #bnav button{flex:1 1 0;min-width:0;background:none;border:0;border-bottom:3px solid transparent;color:var(--ink2);font:inherit;font-size:12px;padding:7px 2px 6px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
  #bnav button[aria-selected="true"]{color:var(--ink);font-weight:500;border-bottom-color:var(--accent)}
  #bnav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #bmenu.open{display:block;position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.45)}
  #bmenu .sheet{position:absolute;left:0;right:0;top:calc(58px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);border-radius:0 0 12px 12px;padding:10px 6px 6px}
  #bmenu .sheet button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;font-size:16px;padding:14px 16px;min-height:48px;border-radius:8px;cursor:pointer}
  #bmenu .sheet button[aria-selected="true"]{background:var(--accentbg);font-weight:500}
}
@media (min-width:641px){
  #bmenu.open{display:block;position:fixed;inset:0;z-index:30;background:transparent}
  #bmenu .sheet{position:fixed;width:240px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
  #bmenu .sheet button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;font-size:14px;padding:10px 12px;min-height:40px;border-radius:6px;cursor:pointer}
  #bmenu .sheet button:hover{background:var(--accentbg)}
  #bmenu .sheet button[aria-selected="true"]{background:var(--accentbg);font-weight:500}
}
@media print{#bnav,#bmenu{display:none!important}}
</style>
<script>
(function(){
  var nb=document.querySelector('.navbar'), tv=document.getElementById('tvbtn'), th=document.getElementById('theme');
  if(!nb||!tv||!th) return;
  var row=document.createElement('div'); row.className='wrap toolrow';
  row.appendChild(tv); row.appendChild(th); nb.after(row);
})();
</script>
