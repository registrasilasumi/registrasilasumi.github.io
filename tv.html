<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mode TV – Registrasi Lapas Sukamiskin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Mode TV: tampilan berputar otomatis untuk layar penuh (HDMI).
   Memakai data dan kode akses yang sama dengan index.html (satu alamat/origin). */
:root{
  --bg:#EBEDEF;--panel:#FFFFFF;--top:#DCE0E3;--ink:#1E272D;--ink2:#4E5B64;--ink3:#76838C;--line:#CDD3D8;
  --accent:#46576A;--accentbg:#E3E8EC;--blue:#2F6FB3;--teal:#1F6F6B;--gold:#B88A0B;--violet:#6A55A8;
  --ok:#2E6B3B;--okbg:#E3F0E4;--warn:#80530A;--warnbg:#F7EACB;--bad:#9A2C2C;--badbg:#F6E0DE;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
:root[data-theme="dark"]{
  --bg:#12171B;--panel:#1B2227;--top:#222B31;--ink:#E8EDF0;--ink2:#AEB9C0;--ink3:#82909A;--line:#303B43;
  --accent:#8FA6BD;--accentbg:#27323A;--blue:#6FA8E0;--teal:#55B3AD;--gold:#E0B744;--violet:#A592DD;
  --ok:#7CC48C;--okbg:#1F3425;--warn:#E3B565;--warnbg:#3A2E14;--bad:#E59090;--badbg:#3E2222;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:min(1.0417vw,1.85vh)}  /* 1rem = 20px pada 1920x1080 */
body{font-family:var(--font);background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;cursor:default}
body.idle{cursor:none}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}

/* Pita judul */
header{position:relative;display:flex;align-items:center;gap:1.6rem;padding:1rem 2.4rem;background:var(--top);border-bottom:1px solid var(--line);overflow:hidden;min-height:6.2rem}
header::after{content:"";position:absolute;inset:0 0 0 38%;background:var(--photo) right center/cover no-repeat;opacity:.55;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 55%);mask-image:linear-gradient(90deg,transparent,#000 55%);pointer-events:none}
[data-theme="dark"] header::after{opacity:.25}
header>*{position:relative;z-index:1}
.logos{display:flex;gap:.8rem}
.logos i{display:block;width:3.8rem;height:3.8rem;background-size:contain;background-repeat:no-repeat;background-position:center}
.l1{background-image:var(--logo-k)}.l2{background-image:var(--logo-l)}.l3{background-image:var(--logo-p)}
.ttl small{display:block;font-size:.78rem;letter-spacing:.08em;color:var(--ink2);font-weight:600;text-transform:uppercase}
.ttl b{display:block;font-size:1.7rem;font-weight:700;line-height:1.15}
.clock{margin-left:auto;text-align:right;background:color-mix(in srgb,var(--panel) 86%,transparent);padding:.5rem 1.2rem;border-radius:.6rem;border:1px solid var(--line)}
.clock b{display:block;font-family:var(--mono);font-size:2.3rem;font-weight:600;line-height:1.1;letter-spacing:.02em}
.clock span{font-size:.95rem;color:var(--ink2);font-weight:500}

/* Panggung */
main{position:relative;padding:1.4rem 2.4rem 0;min-height:0}
.slide{position:absolute;inset:1.4rem 2.4rem 0;display:flex;flex-direction:column;gap:1.2rem;animation:in .6s ease both}
.slide.out{animation:out .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(.8rem)}to{opacity:1;transform:none}}
@keyframes out{from{opacity:1}to{opacity:0}}
.stitle{display:flex;align-items:baseline;gap:1rem}
.stitle h1{font-size:1.9rem;font-weight:700;letter-spacing:.01em}
.stitle span{color:var(--ink2);font-size:1.05rem}
.stitle em{margin-left:auto;font-style:normal;font-family:var(--mono);color:var(--ink3);font-size:1rem}

.card{background:var(--panel);border:1px solid var(--line);border-radius:.8rem;padding:1.1rem 1.4rem;min-height:0}
.card h2{font-size:.9rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:600;margin-bottom:.8rem}

/* Beranda */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2rem}
.tile{background:var(--panel);border:1px solid var(--line);border-top:.3rem solid var(--accent);border-radius:.8rem;padding:.9rem 1.4rem 1rem}
.tile.t2{border-top-color:var(--teal)}.tile.t3{border-top-color:var(--gold)}.tile.t4{border-top-color:var(--blue)}
.tile small{display:block;font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.tile b{display:block;font-size:4.2rem;line-height:1.05;font-weight:700;font-variant-numeric:tabular-nums;margin:.2rem 0 .1rem}
.tile span{font-size:.95rem;color:var(--ink2)}
.meter{height:.9rem;border-radius:1rem;background:var(--accentbg);overflow:hidden;margin-top:.55rem}
.meter i{display:block;height:100%;background:var(--accent);border-radius:1rem}
.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.2rem;flex:1;min-height:0}
.bars{display:flex;flex-direction:column;gap:.75rem}
.bar{display:grid;grid-template-columns:11rem 1fr 3.6rem;align-items:center;gap:.8rem;font-size:1.3rem}
.bar .tr{height:.95rem;background:var(--accentbg);border-radius:1rem;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:1rem}
.bar.c2 .tr i{background:var(--teal)}
.bar b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:.55rem 1.4rem;margin-top:1rem;padding-top:.9rem;border-top:1px solid var(--line);font-size:1.15rem}
.mini div{display:flex;justify-content:space-between;gap:.6rem}
.mini b{font-variant-numeric:tabular-nums}

/* Daftar (sidang / pemeriksaan / bebas) */
.rows{display:flex;flex-direction:column;gap:.7rem}
.row{display:grid;grid-template-columns:5.6rem 6rem 1fr auto;align-items:center;gap:1.3rem;background:var(--panel);border:1px solid var(--line);border-radius:.8rem;padding:.5rem 1.3rem;height:4.5rem}
.row.bb{grid-template-columns:5.6rem 1fr auto auto}
.row.today{border-color:var(--gold);box-shadow:inset .3rem 0 0 var(--gold)}
.chip{text-align:center;line-height:1.05}
.chip small{display:block;font-size:.72rem;letter-spacing:.08em;color:var(--ink2);font-weight:600;text-transform:uppercase}
.chip b{display:block;font-size:1.55rem;font-weight:700;line-height:1.1}
.jam{font-family:var(--mono);font-size:1.45rem;font-weight:600;color:var(--blue)}
.who b{display:block;font-size:1.45rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;font-size:.9rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where{text-align:right;max-width:30rem;font-size:1.05rem;color:var(--ink2);line-height:1.25}
.pill{display:inline-block;padding:.18rem .7rem;border-radius:2rem;font-size:.85rem;font-weight:600;background:var(--accentbg);color:var(--accent);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
.row.done .who b,.row.done .jam,.row.done .chip b{text-decoration:line-through;text-decoration-thickness:.12rem}
.row.done{opacity:.55}
.note{color:var(--ink2);font-size:1rem;margin-top:.2rem}

/* Di luar */
.out3{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:1.2rem;flex:1;min-height:0;align-content:start}
.out3 .card b.big{display:block;font-size:4rem;font-weight:700;line-height:1;margin:.1rem 0 .7rem}
.names{display:flex;flex-wrap:wrap;gap:.5rem}
.names span{background:var(--accentbg);border-radius:.5rem;padding:.3rem .8rem;font-size:1.15rem}

.empty{margin:auto;text-align:center;color:var(--ink2)}
.empty b{display:block;font-size:1.9rem;color:var(--ink);margin-bottom:.4rem}

/* Kaki */
footer{position:relative;display:flex;align-items:center;gap:1.4rem;padding:2.7rem 2.4rem .8rem;font-size:.92rem;color:var(--ink2)}
footer .prog{position:absolute;left:2.4rem;right:2.4rem;top:.2rem;height:2.4rem;background:transparent}
footer .prog:before{content:"";position:absolute;left:0;right:0;bottom:.12rem;border-top:.2rem dashed var(--line)}
footer .prog i{position:absolute;left:0;bottom:.12rem;display:block;height:.3rem;width:0;border-radius:.3rem;background:linear-gradient(90deg,transparent,var(--gold))}
footer .prog i.run{animation:fill linear forwards}
footer .cat{position:absolute;left:0;bottom:.02rem;width:3rem;height:3rem;margin-left:-1.5rem}
footer .cat.run{animation:runx linear forwards}
footer .cat svg{width:100%;height:100%;overflow:visible;display:block}
body.paused footer .prog i,body.paused footer .cat,body.paused footer .cat *{animation-play-state:paused}
@keyframes fill{from{width:0}to{width:100%}}
@keyframes runx{from{left:0}to{left:100%}}
.ct-b{animation:ct_bob .32s ease-in-out infinite}
.ct-a{animation:ct_a .32s ease-in-out infinite alternate}
.ct-c{animation:ct_c .32s ease-in-out infinite alternate}
.ct-h{animation:ct_h .5s ease-in-out infinite alternate}
.ct-e{animation:ct_e .32s ease-in-out infinite alternate}
.ct-d{animation:ct_d .6s ease-out infinite;transform-origin:center}
@keyframes ct_bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes ct_a{from{transform:rotate(-32deg)}to{transform:rotate(32deg)}}
@keyframes ct_c{from{transform:rotate(32deg)}to{transform:rotate(-32deg)}}
@keyframes ct_h{from{transform:rotate(-16deg) translateX(-1px)}to{transform:rotate(16deg) translateX(1px)}}
@keyframes ct_e{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes ct_d{0%{opacity:.8;transform:translateX(0) scale(.5)}100%{opacity:0;transform:translateX(-26px) scale(1.5)}}
@media (prefers-reduced-motion:reduce){footer .cat,footer .cat *{animation:none!important}}
.dots{display:flex;gap:.5rem;flex-wrap:wrap}
.dots span{padding:.2rem .8rem;border-radius:2rem;background:var(--accentbg);font-weight:500}
.dots span.on{background:var(--accent);color:var(--panel);font-weight:600}
.stat{margin-left:auto;display:flex;gap:1rem;align-items:center}
.stat .bad{color:var(--bad);font-weight:600}
.hint{position:fixed;right:1.5rem;bottom:4rem;background:#000c;color:#fff;border-radius:.6rem;padding:.6rem 1rem;font-size:.9rem;transition:opacity .6s}
.hint.hide{opacity:0;pointer-events:none}
.paused-badge{display:none;margin-left:.6rem}
body.paused .paused-badge{display:inline-block}

/* Masuk */
#gate{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:9}
#gate.on{display:flex}
#gate form{background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:2rem 2.4rem;width:30rem;display:flex;flex-direction:column;gap:1rem}
#gate h1{font-size:1.5rem}
#gate p{color:var(--ink2);font-size:1rem}
#gate input{font:inherit;font-size:1.2rem;padding:.7rem 1rem;border-radius:.5rem;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#gate button{font:inherit;font-size:1.1rem;font-weight:600;padding:.7rem;border:0;border-radius:.5rem;background:var(--accent);color:var(--panel);cursor:pointer}
#gate .e{color:var(--bad);min-height:1.2rem;font-size:.95rem}
/* Remisi */
.rm{--u:.1411rem}
.rm svg *{transform-box:fill-box}
.rm svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.rm .rm-g8{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:calc(6*var(--u));flex:1;min-height:0}
.rm .rm-stp{background:var(--panel);border:calc(1*var(--u)) solid var(--line);border-top:calc(3*var(--u)) solid var(--accent);border-radius:calc(7*var(--u));padding:calc(4*var(--u)) calc(6*var(--u)) calc(5*var(--u));display:flex;flex-direction:column;gap:calc(2*var(--u));min-height:0;animation:rm_hl 15s infinite}
.rm .rm-stp.k{border-top-color:var(--teal)}.rm .rm-stp.p{border-top-color:var(--gold)}
.rm .rm-sc{background:var(--accentbg);border-radius:calc(5*var(--u));line-height:0;overflow:hidden}
.rm .rm-sc svg{width:100%;height:auto;display:block}
.rm .rm-hd{display:flex;align-items:center;gap:calc(5*var(--u))}
.rm .rm-no{width:calc(17*var(--u));height:calc(17*var(--u));border-radius:calc(5*var(--u));background:var(--accent);color:var(--panel);font-family:var(--mono);font-size:calc(11*var(--u));font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.rm .k .rm-no{background:var(--teal)}.rm .p .rm-no{background:var(--gold)}
.rm .rm-stp h3{margin:0;font-size:calc(11*var(--u));font-weight:700;line-height:1.15}
.rm .rm-stp p{margin:0;font-size:calc(11*var(--u));line-height:1.25;color:var(--ink2);flex:1}
.rm .rm-pill{display:inline-flex;align-items:center;gap:calc(3*var(--u));padding:0 calc(6*var(--u));border-radius:calc(10*var(--u));font-size:calc(11*var(--u));font-weight:600;background:var(--warnbg);color:var(--warn);white-space:nowrap;align-self:flex-start}
.rm .rm-cd{background:var(--panel);border:calc(1*var(--u)) solid var(--line);border-radius:calc(7*var(--u));padding:calc(6*var(--u)) calc(10*var(--u));min-height:0;position:relative}
.rm .rm-cd h2{display:flex;align-items:center;gap:calc(5*var(--u));margin:0 0 calc(4*var(--u));font-size:calc(11*var(--u));letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.rm .rm-cd h2 svg{font-size:calc(14*var(--u));color:var(--accent)}
.rm .rm-li{display:flex;align-items:center;gap:calc(6*var(--u));font-size:calc(11*var(--u));line-height:1.3;padding:calc(2*var(--u)) 0;border-bottom:calc(1*var(--u)) dashed var(--line)}
.rm .rm-li:last-of-type{border-bottom:0}
.rm .rm-li svg{font-size:calc(14*var(--u));color:var(--ok);animation:rm_pulse 3.5s infinite}
.rm .rm-li svg.n{color:var(--accent);animation:none}
.rm .rm-g2{display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:1fr 1fr;gap:calc(6*var(--u));flex:1;min-height:0}
.rm .rm-note{background:var(--warnbg);color:var(--warn);border-radius:calc(5*var(--u));padding:calc(2*var(--u)) calc(7*var(--u));font-size:calc(11*var(--u));display:flex;gap:calc(5*var(--u));align-items:center;margin-top:calc(3*var(--u))}
.rm .rm-tl{display:grid;grid-template-columns:1fr 1fr;gap:calc(4*var(--u))}
.rm .rm-tl div{background:var(--accentbg);border-radius:calc(5*var(--u));padding:calc(3*var(--u)) calc(6*var(--u));font-size:calc(11*var(--u));line-height:1.25}
.rm .rm-tl b{display:block;font-size:calc(11*var(--u));color:var(--accent)}
.rm .rm-mini{position:absolute;right:calc(6*var(--u));top:calc(4*var(--u));width:calc(66*var(--u));background:var(--accentbg);border-radius:calc(5*var(--u));line-height:0}
.rm .rm-mini svg{width:100%;height:auto}

/* Remisi 3/3: jenis-jenis remisi */
.rm .rj-in{display:flex;align-items:center;gap:calc(8*var(--u));background:var(--accent);color:var(--panel);border-radius:calc(7*var(--u));padding:calc(3*var(--u)) calc(12*var(--u));font-size:calc(8.5*var(--u));line-height:1.3}
.rm .rj-in svg{font-size:calc(18*var(--u));flex:none;color:var(--gold)}
.rm .rj-in b{color:#F2CF6B}
.rm .rj-g{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:calc(6*var(--u));flex:1;min-height:0}
.rm .rj-c{background:var(--panel);border:calc(1*var(--u)) solid var(--line);border-top:calc(3*var(--u)) solid var(--c);border-radius:calc(7*var(--u));padding:calc(4*var(--u)) calc(5*var(--u));display:flex;flex-direction:column;align-items:center;gap:calc(2*var(--u));text-align:center;min-height:0;overflow:hidden;animation:rm_hl 15s infinite}
.rm .rj-h{display:flex;align-items:center;gap:calc(4*var(--u));align-self:stretch;justify-content:center}
.rm .rj-n{width:calc(15*var(--u));height:calc(15*var(--u));border-radius:calc(4*var(--u));background:var(--c);color:#fff;font-family:var(--mono);font-size:calc(10*var(--u));font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.rm .rj-h h3{margin:0;font-size:calc(8*var(--u));line-height:1.1;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.02em}
.rm .rj-ic{width:calc(35*var(--u));height:calc(35*var(--u));border-radius:50%;background:color-mix(in srgb,var(--c) 14%,var(--panel));display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;animation:rj_in .7s both;animation-delay:calc(var(--i)*.14s + .15s)}
.rm .rj-ic svg{width:100%;height:100%;display:block}
.rm .rj-h{animation:rj_in .6s both;animation-delay:calc(var(--i)*.14s)}
.rm .rj-c p{animation:rj_in .7s both;animation-delay:calc(var(--i)*.14s + .3s)}
@keyframes rj_in{from{opacity:0;transform:translateY(calc(8*var(--u))) scale(.92)}to{opacity:1;transform:none}}
@keyframes rj_wave{0%,100%{transform:skewY(-5deg) scaleX(1)}50%{transform:skewY(5deg) scaleX(.93)}}
@keyframes rj_bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes rj_tw{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
@keyframes rj_glow{0%,100%{opacity:.25;transform:scale(.92)}50%{opacity:.7;transform:scale(1.08)}}
@keyframes rj_beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}60%{transform:scale(1)}}
@keyframes rj_up{0%{opacity:0;transform:translateY(8px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translateY(-22px) scale(1)}}
@keyframes rj_spin{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.25)}}
@keyframes rj_shake{0%,100%{transform:translateY(0)}25%{transform:translateY(-2.5px)}75%{transform:translateY(2.5px)}}
@keyframes rj_flip{0%,55%{transform:rotate(0)}75%,100%{transform:rotate(180deg)}}
@keyframes rj_pop{0%,20%{transform:scale(0)}35%{transform:scale(1.25)}45%,90%{transform:scale(1)}100%{transform:scale(0)}}
@keyframes rj_fall{0%{opacity:0;transform:translateY(-12px) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translateY(60px) rotate(240deg)}}
@keyframes rj_sand{0%,100%{opacity:.2}50%{opacity:1}}
.rj-wv{transform-origin:0 50%;animation:rj_wave 1.8s ease-in-out infinite}
.rj-bb{animation:rj_bob 1.2s ease-in-out infinite}
.rj-tw{transform-origin:center;animation:rj_tw 2.2s ease-in-out infinite}
.rj-gl{transform-origin:center;animation:rj_glow 3s ease-in-out infinite}
.rj-bt2{transform-origin:center;animation:rj_beat 1.8s ease-in-out infinite}
.rj-fu{transform-origin:center;animation:rj_up 3s ease-in infinite}
.rj-sp{transform-origin:center;animation:rj_spin 2.4s ease-in-out infinite}
.rj-sh{animation:rj_shake .9s ease-in-out infinite}
.rj-fl{transform-origin:center;animation:rj_flip 6s ease-in-out infinite}
.rj-pp{transform-origin:center;animation:rj_pop 5s ease-in-out infinite}
.rj-fa{animation:rj_fall 3.2s linear infinite}
.rj-sn{animation:rj_sand .8s linear infinite}
@media (prefers-reduced-motion:reduce){.rm .rj-c *{animation:none!important}}
.rm .rj-c p{margin:0;font-size:calc(7*var(--u));line-height:1.2;color:var(--ink);flex:1}
.rm .rj-bt{display:grid;grid-template-columns:2fr 1fr;gap:calc(6*var(--u));flex:none}.rm .rj-bt .rm-cd{padding:calc(3*var(--u)) calc(8*var(--u))}
.rm .rj-nt{display:grid;grid-template-columns:1fr 1fr;gap:calc(10*var(--u));font-size:calc(7*var(--u));line-height:1.22;color:var(--ink2)}
.rm .rj-nt+.rj-nt{margin:0}
.rm .rj-dh{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.rm .rj-dh h2{color:#F2CF6B}.rm .rj-dh h2 svg{color:#F2CF6B}

  function slidePkLayanan2() {

    });

    });
    var box = document.createElement('div'); box.className = 'pq-wrap';
    box.innerHTML =
      '<div class="pq-l"><h2 class="pq-h">' + I('list') + 'Persyaratan</h2><div class="pq-g">' + cards + '</div><div class="pq-n">' +
      '<div class="pq-nt w"><span class="pq-ni">' + I('info') + '</span>Penolakan hanya dalam keadaan tertentu (misalnya kondisi keamanan Lapas), disertai alasan tertulis.</div>' +

      '<div class="pq-r"><div class="pq-top"><h2 class="pq-h">' + I('clock') + 'Jangka waktu pelayanan</h2><div class="pq-sg">' + tiles + '</div></div>' +
      '<div class="pq-bot"><h2 class="pq-h">' + I('report') + 'Saluran pengaduan</h2><div class="pq-ch">' + chips + '</div></div></div>';
    var t0 = Date.now();
    var els = box.querySelectorAll('[data-n]');
    (function tick() {
      var k = Math.min(1, (Date.now() - t0 - 400) / 1100); if (k < 0) k = 0;
      for (var j = 0; j < els.length; j++) { var n = +els[j].getAttribute('data-n'); els[j].firstChild.nodeValue = Math.round(n * (1 - Math.pow(1 - k, 3))); }
      if (k < 1) requestAnimationFrame(tick);

  function pk() { return [{ key: 'alurperiksa', label: 'Alur Pemeriksaan', make: slidePkAlur }, { key: 'alurperiksa', label: 'Alur Pemeriksaan', make: slidePkLayanan2 }]; }
  /* ---------- rotasi ---------- */
  function buildPlan() {
    var p = [{ key: 'penghuni', label: 'Penghuni', make: slideBeranda }];
    p = p.concat(agenda('sidang', 'Sidang'), agenda('periksa', 'Pemeriksaan'), bebas());
    var r = [].concat(remisi(), hak(), pk());
    r.forEach(function (e) { e.dur = DUR2; });

  }
  function replan(soft) {
    var keyNow = plan[idx] && plan[idx].key;
    plan = buildPlan();
    if (idx < 0) return show(0);
    if (idx >= plan.length) idx = 0;
    drawDots();
    // jika data berubah saat tampil, segarkan isi slide yang sedang terlihat tanpa pindah
    if (soft && cur) { DETIK = plan[idx].dur || DBASE; var n = plan[idx].make(); n.style.animation = 'none'; cur.replaceWith(n); cur = n; }
  }
  function drawDots() {
    var d = document.getElementById('dots'); d.textContent = '';
    var seen = {}, curKey = plan[idx] && plan[idx].key;
    plan.forEach(function (s) { if (seen[s.key]) return; seen[s.key] = 1; d.appendChild(h('span', { class: s.key === curKey ? 'on' : '', text: s.label })); });
  }

    if (!plan.length) return;

    DETIK = plan[idx].dur || DBASE;
    var st = document.getElementById('stage'), n = plan[idx].make(), old = cur;
    if (old) { old.classList.add('out'); setTimeout(function () { old.remove(); }, 450); }
    st.appendChild(n); cur = n; drawDots();

    clearTimeout(timer);

  }
  function setPaused(v) { paused = v; document.body.classList.toggle('paused', v); if (v) clearTimeout(timer); else show(idx); }

  function applyTema() {
    var t = Q.get('tema') || ls('tema') || 'light';
    if (t === 'auto') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

  }

  var idleT; function awake() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(function () { document.body.classList.add('idle'); }, 3000); }

  function gate(msg) { document.getElementById('gate').classList.add('on'); document.getElementById('ge').textContent = msg || ''; setTimeout(function () { document.getElementById('gk').focus(); }, 50); }
  document.getElementById('gf').addEventListener('submit', function (ev) {

  document.addEventListener('keydown', function (e) {
    if (document.getElementById('gate').classList.contains('on')) return;
    var k = e.key;
    if (k === 'f' || k === 'F') fullscreen();
    else if (k === ' ') { e.preventDefault(); setPaused(!paused); }
    else if (k === 'ArrowRight') show(idx + 1);
    else if (k === 'ArrowLeft') show(idx - 1);

  });
  document.addEventListener('dblclick', fullscreen);
  document.addEventListener('mousemove', awake);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { wake(); poll(); } });

  /* ---------- mulai ---------- */
  function loadAssets() {   // logo dan foto gedung diambil dari index.html (sudah tertanam di sana)
